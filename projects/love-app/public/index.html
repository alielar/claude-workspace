<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Love">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/icon.png">
<title>Love</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Love</h1>
<div class="hero" id="hero"><div class="empty">Loading…</div></div>
<div class="grid" id="grid"></div>

<div class="bar">
  <label class="btn" id="send">Send a photo<input id="file" type="file" accept="image/*" hidden></label>
</div>
<div class="toast" id="toast"></div>

<script>
const key = new URLSearchParams(location.search).get('k') || '';
const $ = (id) => document.getElementById(id);
const toast = (t, ms = 2200) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); };

function ago(at) {
  const m = Math.round((Date.now() - at) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  return d === 1 ? 'yesterday' : d + ' days ago';
}

async function load() {
  if (!key) { $('hero').innerHTML = '<div class="empty">This link is missing its key. Open the link Ali sent you.</div>'; $('send').hidden = true; return; }
  try {
    const r = await fetch('/api/photos?limit=90&k=' + encodeURIComponent(key), { cache: 'no-store' });
    if (r.status === 401) { $('hero').innerHTML = '<div class="empty">This link is not valid.</div>'; return; }
    const { photos } = await r.json();
    if (!photos.length) { $('hero').innerHTML = '<div class="empty">No photo yet.<br>The first one will show up here.</div>'; $('grid').innerHTML = ''; return; }
    const [first, ...rest] = photos;
    $('hero').innerHTML = `<a href="${first.url}"><img src="${first.url}" alt=""></a><span class="when">${ago(first.at)}</span>`;
    $('grid').innerHTML = rest.map(p => `<a href="${p.url}"><img loading="lazy" src="${p.url}" alt="" title="${ago(p.at)}"></a>`).join('');
  } catch { toast('No connection'); }
}

// Shrink on the phone so sending is quick on mobile data.
async function shrink(file, max = 1600) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
}

$('file').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const btn = $('send'); btn.firstChild.textContent = 'Sending…'; btn.setAttribute('disabled', '');
  try {
    const body = await shrink(file);
    const r = await fetch('/api/photo', { method: 'POST', headers: { 'x-key': key, 'content-type': 'image/jpeg' }, body });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Failed');
    toast('Sent');
  } catch (err) { toast('Not sent: ' + err.message, 3500); }
  btn.firstChild.textContent = 'Send a photo'; btn.removeAttribute('disabled');
});

load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
