<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bsaha</title>
<style>
  :root { --bg: #fbf5ec; --ink: #2a211b; --muted: #7a6f65; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161311; --ink: #f3ece2; --muted: #a89e92; --accent: #f0813f; } }
  html, body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  .plate { width: 72px; height: 72px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .plate div { width: 46px; height: 46px; border-radius: 999px; background: var(--bg); }
  h1 { font-size: 28px; margin: 8px 0 0; }
  p { margin: 0; font-size: 18px; color: var(--muted); }
  button { margin-top: 16px; font: inherit; font-weight: 700; font-size: 18px; padding: 14px 28px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="plate"><div></div></div>
  <h1>ما كاينش الأنترنيت</h1>
  <p>Pas de connexion · No connection</p>
  <button onclick="location.reload()">عاود جرب · Réessayer</button>
</main>
</body>
</html>
