<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Agents Hub</title>
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agents">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="mark" aria-hidden="true"></div>
      <h1>Agents Hub</h1>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary block" type="submit">Open</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="list-pane">
      <header class="list-head">
        <div class="title-row">
          <h1>Sessions</h1>
          <button id="alerts" class="btn ghost small" hidden>Turn on alerts</button>
          <button id="new-btn" class="btn primary small" title="New session (N)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New
          </button>
        </div>
        <p id="summary" class="summary"></p>
        <div id="projects" class="chips" role="tablist" aria-label="Projects"></div>
      </header>
      <div id="list" class="list"></div>
    </aside>

    <main id="detail" class="detail-pane"></main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
